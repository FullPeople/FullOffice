<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src fulloffice-preview: data:; style-src 'unsafe-inline'; script-src 'nonce-fulloffice-preview'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root{color-scheme:light dark}body{font:15px/1.65 -apple-system,BlinkMacSystemFont,sans-serif;margin:24px;color:CanvasText;background:Canvas}article{max-width:920px;margin:auto;overflow-wrap:anywhere}h1,h2,h3{line-height:1.3}h1{font-size:2em}h2{border-bottom:1px solid #8885;padding-bottom:.3em}pre,code{font-family:ui-monospace,monospace;background:#8882;border-radius:5px}code{padding:.15em .3em}pre{overflow:auto;padding:14px}pre code{padding:0;background:none}blockquote{border-left:3px solid #6684ef;margin-left:0;padding:0 16px;color:#888}table{border-collapse:collapse;display:block;overflow:auto}td,th{border:1px solid #8885;padding:7px 12px}th{background:#8882}img{max-width:100%;height:auto}a{color:#6488f6}hr{border:0;border-top:1px solid #8885}.remote-image{font-size:13px;color:#888}
</style></head><body><article id="content"></article>
<script nonce="fulloffice-preview">/*MARKDOWN_IT*/</script>
<script nonce="fulloffice-preview">
const md=window.markdownit({html:false,linkify:true,typographer:false});
const originalImage=md.renderer.rules.image;
md.renderer.rules.image=(tokens,index,options,env,renderer)=>{
 const token=tokens[index],src=token.attrGet('src')||'';
 if(/^(https?:)?\/\//i.test(src))return '<span class="remote-image">[网络图片：'+md.utils.escapeHtml(token.content)+']</span>';
 if(!/^data:image\//i.test(src))token.attrSet('src','fulloffice-preview://document/image?path='+encodeURIComponent(src));
 return originalImage(tokens,index,options,env,renderer);
};
const originalLink=md.renderer.rules.link_open||((tokens,index,options,env,renderer)=>renderer.renderToken(tokens,index,options));
md.renderer.rules.link_open=(tokens,index,options,env,renderer)=>{
 const token=tokens[index],href=token.attrGet('href')||'';
 if(href&&!href.startsWith('#')&&!/^(https?:|mailto:)/i.test(href))token.attrSet('href','fulloffice-preview://document/open?path='+encodeURIComponent(href));
 return originalLink(tokens,index,options,env,renderer);
};
window.fullOfficeRender=base64=>{
 const source=new TextDecoder().decode(Uint8Array.from(atob(base64),c=>c.charCodeAt(0)));
 const top=window.scrollY;document.getElementById('content').innerHTML=md.render(source);window.scrollTo(0,top);
};
</script></body></html>
