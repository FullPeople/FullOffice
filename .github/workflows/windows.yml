name: Windows document workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Build
        shell: pwsh
        run: dotnet publish src/FullOffice.Windows/FullOffice.Windows.csproj -c Release -r win-x64 --self-contained false -o artifacts/app
      - name: Build native installation and update helpers
        shell: pwsh
        run: |
          cmake -S src/FullTools.Distribution -B .cache/distribution-build
          if ($LASTEXITCODE -ne 0) { throw 'Native helper configuration failed' }
          cmake --build .cache/distribution-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native helper build failed' }
      - name: Verify Office recovery boundaries
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts/office-recovery'
          $process = Start-Process 'artifacts/app/FullOffice.exe' -ArgumentList @('--office-recovery-probe',$out) -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id; throw 'Owned recovery probe timed out' }
          if ($process.ExitCode -ne 0) { throw 'Office recovery probe failed' }
          $report = Get-Content (Join-Path $out 'report.json') -Raw | ConvertFrom-Json
          if ($report.Passed -ne $true) { throw 'Office recovery report failed' }
      - name: Compile pinned native Office API bridge
        shell: pwsh
        run: |
          cmake -S src/FullOffice.OfficeEngine.Native -B .cache/office-api-compile -DENGINE_COMPILE_ONLY=ON
          if ($LASTEXITCODE -ne 0) { throw 'Office API configuration failed' }
          cmake --build .cache/office-api-compile --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Office API compile failed' }
      - name: Verify installation boundaries and authenticated updates
        shell: pwsh
        run: |
          foreach ($check in @('verify_distribution.py','verify_update_signatures.py','verify_update_versions.py')) {
            python ('tools/' + $check)
            if ($LASTEXITCODE -ne 0) { throw ('Native distribution check failed: ' + $check) }
          }
      - name: Save, revision, workspace and text probes
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/app/FullOffice.exe'
          $fixture = Join-Path $PWD 'tests/fixtures/feature-fixture.pdf'
          foreach ($mode in @('saving','revision','workspace','text')) {
            $out = Join-Path $PWD ('artifacts/' + $mode)
            $process = Start-Process $exe -ArgumentList @('--' + $mode + '-probe',$fixture,$out) -PassThru
            if (-not $process.WaitForExit(55000)) { Stop-Process -Id $process.Id; throw 'Owned probe timed out' }
            $report = Get-Content (Join-Path $out ($mode + '-probe.json')) -Raw | ConvertFrom-Json
            if ($report.Passed -ne $true) { $report | ConvertTo-Json -Depth 10; throw ('Probe failed: ' + $mode) }
          }
      - name: Install Chinese OCR test prerequisites
        timeout-minutes: 15
        shell: pwsh
        run: |
          foreach ($capability in @('Language.Basic~~~zh-CN~0.0.1.0','Language.OCR~~~zh-CN~0.0.1.0')) {
            $state = Get-WindowsCapability -Online -Name $capability
            if ($state.State -ne 'Installed') { Add-WindowsCapability -Online -Name $capability -ErrorAction Stop }
          }
      - name: Full feature probe including Chinese OCR
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/app/FullOffice.exe'
          $fixture = Join-Path $PWD 'tests/fixtures/feature-fixture.pdf'
          $out = Join-Path $PWD 'artifacts/feature'
          $process = Start-Process $exe -ArgumentList @('--feature-probe',$fixture,$out) -PassThru
          if (-not $process.WaitForExit(55000)) { Stop-Process -Id $process.Id; throw 'Owned feature probe timed out' }
          $report = Get-Content (Join-Path $out 'feature-probe.json') -Raw | ConvertFrom-Json
          if ($report.Passed -ne $true) { $report | ConvertTo-Json -Depth 10; throw 'Feature probe failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-document-workspace
          path: artifacts
