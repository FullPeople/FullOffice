name: Public signed Mac package and native upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch immutable actual previous package and bundle manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38475919819 --name mac-installer-${{ matrix.runner }}-38475919819 --dir artifacts/mac-update-baseline
          gh run download 38475919819 --name mac-product-${{ matrix.runner }}-38475919819 --dir artifacts/mac-update-baseline-reports
          gh run download 38479807095 --name mac-product-${{ matrix.runner }}-38479807095 --dir artifacts/mac-update-candidate-reports
      - name: Exercise production public download and native installed upgrade
        run: python3 tools/verify_mac_public_update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-public-update-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            artifacts/mac-public-update/*.json
            artifacts/mac-public-update/*.log
            artifacts/mac-public-update/public.manifest
            artifacts/mac-public-update/installed-pdf-ui/
          if-no-files-found: warn
