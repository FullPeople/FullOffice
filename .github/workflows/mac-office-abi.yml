name: Inspect verified macOS Office editing runtime
on:
  push:
    branches: [codex/macos-office-engine-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile native Mac API syntax before runtime download
        run: |
          xcrun clang++ -fsyntax-only -std=c++17 -fblocks -D_MAC -DDESKTOP_NO_USE_DYNAMIC_LIBRARY -DQ_DECL_EXPORT= -Isrc/FullOffice.OfficeEngine.Native/third_party/desktop-sdk/ChromiumBasedEditors/lib/include src/FullOffice.OfficeEngine.Native/MacOfficeHost.mm
          xcrun clang++ -fsyntax-only -std=c++17 -D_MAC -DDESKTOP_NO_USE_DYNAMIC_LIBRARY -DQ_DECL_EXPORT= -Isrc/FullOffice.OfficeEngine.Native/third_party/desktop-sdk/ChromiumBasedEditors/lib/include src/FullOffice.OfficeEngine.Native/MacOfficeHelper.cpp
      - name: Verify actual upstream Mac binary and inspect editor ABI
        run: python3 tools/inspect_mac_office_engine.py --native-window
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac-office-abi-${{ matrix.runner }}-${{ github.run_id }}
          path: artifacts/mac-office-abi/
          if-no-files-found: warn
